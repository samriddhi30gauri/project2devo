apiVersion: apps/v1
kind: Deployment
metadata: {name: payment-api, namespace: paysecure}
spec:
  replicas: 6
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 2, maxUnavailable: 1}}
  selector: {matchLabels: {app: payment-api}}
  template:
    metadata: {labels: {app: payment-api}}
    spec:
      serviceAccountName: payment-api
      containers:
      - name: api
        image: paysecure/payment-api:v1.29.0
        ports: [{containerPort: 8080}]
        env:
        - {name: AURORA_ENDPOINT, valueFrom: {secretKeyRef: {name: aurora-secret, key: endpoint}}}
        - {name: IDEMPOTENCY_TABLE, value: "txn_idempotency"}
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10}
        livenessProbe: {httpGet: {path: /livez, port: 8080}}
        resources: {requests: {cpu: "500m", memory: "1Gi"}, limits: {cpu: "1000m", memory: "2Gi"}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: payment-api, namespace: paysecure}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: payment-api}
  minReplicas: 6
  maxReplicas: 40
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
  - type: Pods
    pods: {metric: {name: http_requests_per_second}, target: {type: AverageValue, averageValue: "200"}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: payment-api-pdb, namespace: paysecure}
spec: {minAvailable: "75%", selector: {matchLabels: {app: payment-api}}}
