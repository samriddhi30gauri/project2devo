apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: cde-segmentation, namespace: paysecure}
spec:
  podSelector: {matchLabels: {app: tokenisation-service}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {matchLabels: {app: payment-api}}
    ports: [{protocol: TCP, port: 8443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny, namespace: paysecure}
spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
